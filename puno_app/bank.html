<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puno Bank</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --text:#c9d1d9; --dim:#8b949e; --acc:#58a6ff; --green:#3fb950;
    --amber:#d29922; --red:#f85149; --mono:ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:17px;letter-spacing:.4px}
  header h1 b{color:var(--acc)}
  header .sub{color:var(--dim);font-family:var(--mono);font-size:12px}
  #live{color:var(--green);font-weight:600}
  #live.paused{color:var(--amber)}
  main{max-width:1120px;margin:0 auto;padding:16px 20px 60px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
         gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:10px 12px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;
           letter-spacing:.5px}
  .card .v{font:600 20px var(--mono);margin-top:4px}
  .card .v small{color:var(--dim);font-weight:400;font-size:12px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:12px 14px;margin-top:14px}
  .panel h2{margin:0 0 10px;font-size:12px;color:var(--dim);
            text-transform:uppercase;letter-spacing:.6px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  canvas#plot{width:100%;height:420px;display:block;background:var(--panel2);
              border:1px solid var(--line);border-radius:6px}
  button{background:#21262d;color:var(--text);border:1px solid var(--line);
         border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.acc{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.acc:hover{background:#1a5fd0}
  button.danger{background:#6e2f2a;border-color:#6e2f2a}
  input[type=number]{width:86px;background:var(--panel2);color:var(--text);
         border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px}
  input[type=text]{background:var(--panel2);color:var(--text);
         border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;
         font-family:var(--mono)}
  label{font-size:12px;color:var(--dim);display:inline-flex;align-items:center;
        gap:6px}
  .log{font-family:var(--mono);font-size:12px;background:var(--panel2);
       border:1px solid var(--line);border-radius:6px;padding:10px;
       max-height:240px;overflow-y:auto;white-space:pre-wrap}
  .muted{color:var(--dim);font-size:12px}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         border-radius:6px;padding:6px 8px;font-size:13px}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
  .ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)}
  .scroll{max-height:260px;overflow-y:auto}
  #toast{position:fixed;right:16px;bottom:16px;background:var(--panel);
         border:1px solid var(--line);border-radius:8px;padding:10px 14px;
         font-family:var(--mono);font-size:12px;display:none;max-width:60%}
  #toast.err{border-color:var(--red)} #toast.ok{border-color:var(--green)}
</style>
</head>
<body>
<header>
  <h1>Puno <b>Bank</b></h1>
  <span class="sub" id="sub"></span>
  <span id="live">● LIVE</span>
</header>
<main>
  <section class="cards" id="cards"></section>

  <div class="panel">
    <h2>Transaction</h2>
    <div class="row">
      <label>from <select id="txFrom"></select></label>
      <label>to <select id="txTo"></select></label>
      <label>amount <input type="number" id="txAmount" value="10" min="1"></label>
      <button id="doTx" class="acc">Submit</button>
      <span class="muted" id="txNote"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Network controls</h2>
    <div class="row" style="margin-bottom:10px">
      <label>node <select id="selNode"></select></label>
      <button id="doKill" class="danger">Kill</button>
      <button id="doRestart">Restart (stateless)</button>
      <button id="doResync">Resync</button>
      <button id="doKillAll" class="danger">Kill all</button>
      <button id="doRestartAll">Restart all</button>
    </div>
    <div class="row">
      <label>partition <input type="text" id="partGroups" size="20"
             placeholder="0,1,2 / 3,4,5"></label>
      <button id="doPartition">Apply</button>
      <button id="doFull">Full network</button>
    </div>
  </div>

  <div class="panel">
    <h2>Rebuild</h2>
    <div class="row">
      <label>fragments <input type="number" id="cfgN" value="6" min="2" max="16"></label>
      <label>k (witnesses) <input type="number" id="cfgK" value="3" min="1"></label>
      <label>vote timeout <input type="number" id="cfgVt" value="0.8" step="0.1" min="0.2"></label>
      <label>accounts <input type="number" id="cfgAcc" value="24" min="2"></label>
      <label>min balance <input type="number" id="cfgBal" value="100" min="1"></label>
      <button id="doNew" class="acc">Rebuild network</button>
    </div>
  </div>

  <div class="panel">
    <h2>Fabric</h2>
    <canvas id="plot"></canvas>
  </div>

  <div class="panel">
    <h2>Accounts</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>address</th><th>owner frag</th><th>balance</th></tr></thead>
        <tbody id="acctBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h2>Event log</h2>
    <div class="log" id="log"><span class="muted">waiting…</span></div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let status_ = null, accts = [];
let fragXY = {};

function fmt(v, d = 2) {
  if (v == null) return "–";
  if (typeof v === "number" && Math.abs(v) >= 1e5) return v.toLocaleString();
  return typeof v === "number" ? v.toFixed(d) : String(v);
}

function toast(msg, cls = "") {
  const t = $("toast");
  t.textContent = msg; t.className = "ok " + cls;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 3500);
}

async function api(path, body) {
  const opts = body == null ? {} : {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  };
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!j.ok) toast(j.error || "request failed", "err");
  return j;
}

async function refreshStatus() {
  try {
    const j = await api("/api/status");
    if (!j.ok) { $("live").className = "paused"; return; }
    status_ = j;
    renderCards();
    renderCanvas();
  } catch (e) {
    $("live").className = "paused";
  }
}

async function refreshAccounts() {
  const j = await api("/api/accounts");
  if (!j.ok) return;
  accts = j.accounts;
  renderAcctTable();
  rebuildSelects();
}

function renderCards() {
  const s = status_;
  const live = s.nodes_alive;
  const frags = [];
  for (let f = 0; f < s.n_frag; f++) {
    const on = s.consensus && s.consensus[f] != null ? s.consensus[f] : null;
    const b = s.frag_blocks ? (s.frag_blocks[f] ?? 0) : 0;
    const a = live[f];
    frags.push({
      k: "frag " + f,
      v: (a ? "UP" : "DOWN") + " · " + b + " blk",
      cls: a ? (on ? "ok" : "warn") : "bad"
    });
  }
  const cards = [
    {k: "fragments", v: s.n_frag, cls: ""},
    {k: "witnesses/frag", v: s.k, cls: ""},
    {k: "alive", v: s.alive_count + " / " + s.n_frag, cls: s.alive_count === s.n_frag ? "ok" : "bad"},
    {k: "committed", v: s.committed, cls: "ok"},
    {k: "denied", v: s.denied, cls: s.denied ? "warn" : ""},
    {k: "blocks", v: s.total_blocks, cls: ""},
    {k: "balance", v: fmt(s.balance_total) + " <small>/ " + fmt(s.balance_expected) + "</small>", cls: s.conserved ? "ok" : "bad"},
    {k: "conserved", v: s.conserved ? "yes" : "NO", cls: s.conserved ? "ok" : "bad"}
  ];
  const html = [...cards, ...frags].map(c =>
    `<div class="card"><div class="k">${c.k}</div>` +
    `<div class="v ${c.cls}">${c.v}</div></div>`).join("");
  $("cards").innerHTML = html;
}

function renderAcctTable() {
  $("acctBody").innerHTML = accts.map(a =>
    `<tr><td>${a.idx}</td><td>${a.addr}</td><td>${a.owner}</td>` +
    `<td>${fmt(a.balance)}</td></tr>`).join("");
}

function rebuildSelects() {
  if (!accts.length) return;
  const opts = accts.map(a => `<option value="${a.idx}">#${a.idx} · ${a.short} · bal ${a.balance}</option>`).join("");
  const keep1 = $("txFrom").value, keep2 = $("txTo").value;
  $("txFrom").innerHTML = opts;
  $("txTo").innerHTML = opts;
  if (keep1) $("txFrom").value = keep1;
  if (keep2) $("txTo").value = keep2;
  const nodes = Array.from({length: status_.n_frag}, (_, i) =>
    `<option value="${i}">node ${i} · ${status_.nodes_alive[i] ? "up" : "down"}</option>`).join("");
  $("selNode").innerHTML = nodes;
}

function layoutFrags() {
  const n = status_.n_frag;
  fragXY = {};
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n - Math.PI / 2;
    fragXY[i] = {x: 0.5 + 0.4 * Math.cos(a), y: 0.5 + 0.4 * Math.sin(a)};
  }
}

function renderCanvas() {
  const cv = $("plot"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  layoutFrags();

  // witness edges
  ctx.lineWidth = 1;
  status_.witnesses.forEach((ws, i) => {
    for (const j of ws) {
      if (j <= i) continue;
      const a = fragXY[i], b = fragXY[j];
      ctx.strokeStyle = "rgba(88,166,255,0.28)";
      ctx.beginPath();
      ctx.moveTo(a.x * W, a.y * H);
      ctx.lineTo(b.x * W, b.y * H);
      ctx.stroke();
    }
  });

  // fragments
  for (let i = 0; i < status_.n_frag; i++) {
    const p = fragXY[i], x = p.x * W, y = p.y * H;
    const alive = status_.nodes_alive[i];
    const on = status_.consensus && status_.consensus[i];
    const blk = status_.frag_blocks ? (status_.frag_blocks[i] ?? 0) : 0;
    const col = !alive ? "#f85149" : (on === false ? "#d29922" : "#3fb950");
    ctx.beginPath();
    ctx.arc(x, y, 26, 0, 2 * Math.PI);
    ctx.fillStyle = "#161b22";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = col;
    ctx.stroke();
    ctx.fillStyle = "var(--text)";
    ctx.font = "600 13px ui-monospace,Consolas,monospace";
    ctx.textAlign = "center";
    ctx.fillText("f" + i, x, y + 4);
    ctx.fillStyle = "#8b949e";
    ctx.font = "11px ui-monospace,Consolas,monospace";
    ctx.fillText(blk + " blk", x, y + 20);
  }

  // legend
  ctx.textAlign = "left";
  ctx.font = "12px ui-monospace,Consolas,monospace";
    ctx.fillStyle = "#3fb950"; ctx.fillText("● up / in consensus", 12, 20);
    ctx.fillStyle = "#d29922"; ctx.fillText("● up / no consensus", 12, 38);
    ctx.fillStyle = "#f85149"; ctx.fillText("● down (killed)", 12, 56);
}

async function doTx() {
  const f = +$("txFrom").value, t = +$("txTo").value, amt = +$("txAmount").value;
  const j = await api("/api/submit", {from: f, to: t, amount: amt});
  if (j.ok) { $("txNote").textContent = j.cid + " · " + amt + " from #" + f + " → #" + t; toast("tx " + j.cid + " submitted", "ok"); }
}

$("doTx").onclick = doTx;
$("doKill").onclick = async () => { const j = await api("/api/kill", {node: +$("selNode").value}); if (j.ok) toast("node killed", "ok"); };
$("doRestart").onclick = async () => { const j = await api("/api/restart", {node: +$("selNode").value}); if (j.ok) toast("node restarted (stateless)", "ok"); };
$("doResync").onclick = async () => { const j = await api("/api/resync", {node: +$("selNode").value}); if (j.ok) toast("resync sent", "ok"); };
$("doKillAll").onclick = async () => { const j = await api("/api/kill-all", {}); if (j.ok) toast("all nodes killed", "ok"); };
$("doRestartAll").onclick = async () => { const j = await api("/api/restart-all", {}); if (j.ok) toast("all nodes restarted", "ok"); };
$("doPartition").onclick = async () => {
  const raw = $("partGroups").value;
  const groups = raw.split("/").map(g => g.split(",").map(x => +x.trim()).filter(x => !isNaN(x))).filter(g => g.length);
  if (!groups.length) { toast("parse partition, e.g. 0,1,2 / 3,4,5", "err"); return; }
  const j = await api("/api/partition", {groups});
  if (j.ok) toast("partition applied", "ok");
};
$("doFull").onclick = async () => { const j = await api("/api/full-network", {}); if (j.ok) toast("full network restored", "ok"); };
$("doNew").onclick = async () => {
  const j = await api("/api/new", {
    n_frag: +$("cfgN").value, k: +$("cfgK").value,
    vote_timeout: +$("cfgVt").value, n_accounts: +$("cfgAcc").value,
    min_balance: +$("cfgBal").value
  });
  if (j.ok) { toast("network rebuilt", "ok"); refreshAccounts(); }
};

function renderLog() {
  if (!status_) return;
  const log = status_.event_log || [];
  const el = $("log");
  if (!log.length) { el.innerHTML = '<span class="muted">waiting…</span>'; return; }
  const body = log.slice(-120).map(l => l.replace(/</g, "&lt;")).join("\n");
  const wasBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  el.innerHTML = body;
  if (wasBottom) el.scrollTop = el.scrollHeight;
}

async function tick() {
  await refreshStatus();
  renderLog();
  setTimeout(tick, 1000);
}

function onResize() { renderCanvas(); }
window.addEventListener("resize", onResize);

(async function init() {
  await refreshStatus();
  refreshAccounts();
  const s = status_;
  if (s) {
    $("sub").textContent = "n=" + s.n_frag + " k=" + s.k + " vt=" + s.vote_timeout +
      " · " + s.n_accounts + " accounts × " + s.min_balance + (s.tls ? " · tls" : "");
  }
  tick();
})();
</script>
</body>
</html>
