<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puno Classify</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --text:#c9d1d9; --dim:#8b949e; --acc:#58a6ff; --green:#3fb950;
    --amber:#d29922; --red:#f85149; --mono:ui-monospace,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:17px;letter-spacing:.4px}
  header h1 b{color:var(--acc)}
  header .sub{color:var(--dim);font-family:var(--mono);font-size:12px}
  main{max-width:760px;margin:0 auto;padding:16px 20px 60px}
  textarea{width:100%;height:110px;background:var(--panel2);color:var(--text);
           border:1px solid var(--line);border-radius:8px;padding:10px;
           font:14px/1.4 var(--mono);resize:vertical}
  button{background:#1f6feb;color:#fff;border:1px solid #1f6feb;border-radius:8px;
         padding:9px 18px;font-size:14px;cursor:pointer;margin-top:8px}
  button:hover{background:#1a5fd0}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:8px;
          padding:14px 16px;margin-top:16px}
  .result .big{font-size:22px;font-weight:600}
  .result .big span{color:var(--acc)}
  .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;
       margin:6px 0}
  .bar div{height:100%;background:var(--green);border-radius:4px}
  .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:12px 16px;margin-top:16px}
  .panel h2{margin:0 0 8px;font-size:12px;color:var(--dim);
            text-transform:uppercase;letter-spacing:.6px}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);
        border-radius:999px;padding:3px 10px;font-size:12px;margin:3px 4px 3px 0;
        font-family:var(--mono)}
  .muted{color:var(--dim);font-size:12px}
  #samples span{cursor:pointer;border-color:var(--line)}
  #samples span:hover{border-color:var(--acc);color:var(--acc)}
  #err{color:var(--red);font-family:var(--mono);font-size:12px;margin-top:8px;
       white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>Puno <b>Classify</b></h1>
  <span class="sub" id="sub"></span>
</header>
<main>
  <textarea id="text" placeholder="Type or paste text to classify, e.g.: the storm front brought heavy rain and fog overnight"></textarea>
  <div>
    <button id="go">Classify</button>
    <span class="muted" id="samples">samples:
      <span>heavy rain and thunder tonight</span>
      <span>braised pork shoulder with garlic and herbs</span>
      <span>the striker scored in the final match</span>
      <span>the kernel thread panicked on the cache line</span>
    </span>
  </div>
  <div class="result" id="result" hidden>
    <div class="big">Result: <span id="label"></span></div>
    <div id="bars"></div>
    <div class="row"><span>tick: nearest-unit routing on the Puno net population</span><span id="meta"></span></div>
  </div>
  <div class="panel">
    <h2>Model</h2>
    <div id="model"></div>
  </div>
  <div id="err"></div>
</main>
<script>
const $ = id => document.getElementById(id);

async function init() {
  const r = await fetch("/api/info");
  const info = await r.json();
  $("sub").textContent = `${info.meta.n_classes} classes · ${info.meta.n_units} units · dim ${info.meta.dim} · vocab ${info.meta.vocab_size}`;
  $("model").innerHTML =
    info.classes.map(c => `<span class="chip">${c}</span>`).join("") +
    `<div class="muted" style="margin-top:8px">spacing ${info.spacing_text} · consensus ${info.consensus_text} · ledgers ${info.ledger_chains} chains / ${info.ledger_blocks} blocks</div>`;
}

async function classify() {
  const text = $("text").value.trim();
  $("err").textContent = "";
  if (!text) return;
  try {
    const r = await fetch("/api/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await r.json();
    if (!data.ok) { $("err").textContent = data.error || "error"; return; }
    $("result").hidden = false;
    $("label").textContent = data.label;
    const bars = data.confidences.map(c =>
      `<div class="row"><span>${c.label}</span><span>${(c.confidence*100).toFixed(1)}%</span></div>
       <div class="bar"><div style="width:${(c.confidence*100).toFixed(1)}%"></div></div>`).join("");
    $("bars").innerHTML = bars;
  } catch (e) { $("err").textContent = String(e); }
}

$("go").onclick = classify;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); classify(); } });
$("samples").addEventListener("click", e => {
  if (e.target.tagName === "SPAN") { $("text").value = e.target.textContent; classify(); }
});
init();
</script>
</body>
</html>
