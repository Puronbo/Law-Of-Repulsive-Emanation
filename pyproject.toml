[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "puno-calculus"
version = "1.0.0"
description = "The Puno Calculus: folding, unfolding, creases, and the Universal Map"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
puno = "puno_cli:main"

[tool.setuptools]
py-modules = ["puno_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
