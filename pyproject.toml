[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "puno-calculus"
version = "1.0.0"
description = "The Puno Calculus: folding, unfolding, creases, the Universal Map, and the epoch_0d datum (2000-10-26: 80-divisor pair, prime-pairing rule, 1,914,467 chain fold, gcd triangle 2000/31/1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
puno = "puno_cli:main"

[tool.setuptools]
py-modules = ["puno_cli"]
packages = ["puno_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
