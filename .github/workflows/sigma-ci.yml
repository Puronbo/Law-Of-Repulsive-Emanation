name: Sigma Chassis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy mpmath pytest
          pip install -e sigma_venv/sigma
      
      - name: Run pytest
        run: |
          python -m pytest tests/test_sigma.py -v
      
      - name: Run sigma verify
        run: |
          python -m sigma verify
      
      - name: Run sigma book
        run: |
          python -m sigma book
      
      - name: Run sigma currency
        run: |
          python -m sigma currency
      
      - name: Run sigma e8
        run: |
          python -m sigma e8
      
      - name: Run sigma bridge
        run: |
          python -m sigma bridge
